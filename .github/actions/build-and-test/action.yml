name: Build and test
description: >-
  Install the dependencies of HelloUtau, configure, build and run every test, and publish a
  summary of the run.

# The steps that ci.yml and deploy.yml share, for every system. The system enters through the
# inputs and through runner.os, so that a further system is one more entry of the matrices of the
# workflows. The build is in build/Release for the variant release, where the packaging scripts
# read it, and in build/Debug or build/asan for the other variants. See the workflow in
# docs/Distribution.md.

inputs:
  variant:
    description: >-
      release, the build of the assets, debug, with the assertions and the checks of the debug
      runtime, or asan, with AddressSanitizer.
    required: false
    default: release
  channel:
    description: The value of HELLO_BUILD_CHANNEL, release for the tag of a version and ci otherwise.
    required: true
  triplet:
    description: >-
      The triplet of HelloUtau that the matrix names, such as x86_64-windows-msvc, which the build
      must detect. It is checked, never used for a name.
    required: true
  vcpkg-triplet:
    description: The triplet of vcpkg in the overlay, such as x64-windows.
    required: true
  qt-arch:
    description: The architecture of Qt for aqt, such as win64_msvc2022_64.
    required: true
  qt-tools:
    description: >-
      The tools of the installer of Qt that the build needs, as install-qt-action takes them, such
      as the toolchain of llvm-mingw. Empty for none.
    required: false
    default: ''
  compiler:
    description: >-
      The C++ compiler of the variants release and debug, such as x86_64-w64-mingw32-clang++, or
      empty for the compiler that CMake finds. The variant asan is built by clang++ on Windows
      and by the compiler that CMake finds on the other systems.
    required: false
    default: ''

# The triplet is the one that cmake/DetectTriplet.cmake detects, read from the cache of the build,
# so that the workflows do not repeat it.
outputs:
  triplet:
    description: The triplet of HelloUtau, such as x86_64-windows-msvc, which names the assets.
    value: ${{ steps.configure.outputs.triplet }}
  build-directory:
    description: The build directory of the variant, such as build/Release.
    value: ${{ steps.variant.outputs.directory }}

runs:
  using: composite
  steps:
    # The build directory and the configuration of the variant. Release carries the debug
    # information (cmake/ConfigureBuildTypes.cmake), so that the symbols of release are published
    # beside the assets for the analysis of crash dumps, and the reports of asan, which runs the
    # tests faster than Debug, name the functions and the lines.
    - id: variant
      shell: bash
      run: |
        set -euo pipefail
        compiler="${{ inputs.compiler }}"
        case "${{ inputs.variant }}" in
          release) directory=build/Release; type=Release; asan=OFF ;;
          debug) directory=build/Debug; type=Debug; asan=OFF ;;
          asan) directory=build/asan; type=Release; asan=ON ;;
          *) echo "::error::The variant ${{ inputs.variant }} is none of release, debug and asan."
             exit 1 ;;
        esac
        # asan is built by clang on Windows, as locally, with the ABI of MSVC. The runtime of
        # clang has the same name as that of MSVC, whose directory the environment of MSVC puts
        # first, so the tests put its directory first again. On Linux GCC builds it, and on
        # macOS Apple clang, the compilers that CMake finds.
        runtime=
        if [ "$asan" = ON ] && [ "$RUNNER_OS" = "Windows" ]; then
          compiler=clang++
          runtime="$(cygpath -u "$(clang++ -print-resource-dir)")/lib/windows"
          if [ ! -f "$runtime/clang_rt.asan_dynamic-x86_64.dll" ]; then
            echo "::error::The runtime of AddressSanitizer is missing from $runtime."
            exit 1
          fi
        fi
        # On macOS, test_AppLoader loads and unloads its plugin in each test, and AddressSanitizer
        # reported an ODR violation of the global stdc_plugin_metadata of the plugin with itself:
        # both registrations named the same library and the same size. Level 1 reports an ODR
        # violation only between globals of different sizes. On macOS the check itself then failed
        # with SEGV_ACCERR in __asan_register_globals while a copy of the plugin was loaded, which
        # indicates that the registrations of an unloaded copy remain and refer to unmapped memory.
        # Level 0 turns the check off there.
        options=
        if [ "$asan" = ON ] && [ "$RUNNER_OS" = "macOS" ]; then
          options="detect_odr_violation=0"
        elif [ "$asan" = ON ] && [ "$RUNNER_OS" != "Windows" ]; then
          options="detect_odr_violation=1"
        fi
        {
          echo "BUILD_DIR=$directory"
          echo "BUILD_TYPE=$type"
          echo "BUILD_ASAN=$asan"
          echo "BUILD_COMPILER=$compiler"
          echo "ASAN_RUNTIME_DIR=$runtime"
          echo "ASAN_OPTIONS=$options"
        } >> "$GITHUB_ENV"
        echo "directory=$directory" >> "$GITHUB_OUTPUT"

    # The protocol tests of the programs are Python scripts, see CLAUDE.md.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Ninja
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Windows) choco install ninja -y --no-progress ;;
          macOS) brew install ninja ;;
          *) python -m pip install ninja ;;
        esac

    # The libraries of the system that the official binaries of Qt for Linux require: OpenGL, EGL
    # and xkbcommon to configure Qt Gui, and fontconfig and PulseAudio to run the tests with the
    # offscreen platform. The other libraries are part of the runner.
    - if: runner.os == 'Linux'
      name: System libraries
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libgl-dev libegl-dev libxkbcommon-dev \
          libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libpulse0

    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # The compiler cache, kept in the cache of GitHub Actions entry by entry. A fresh checkout
    # gives every source a new time, so that Ninja alone rebuilds everything, and sccache serves
    # the objects whose preprocessed source and options did not change.
    - uses: mozilla-actions/sccache-action@v0.0.11
    - name: sccache
      shell: bash
      run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

    # The official binaries of Qt, as for a local build. Multimedia is an add-on of aqt, and Svg
    # and the Linguist tools come with the base installation. aqtinstall 3.3.0, the latest release,
    # finds no Qt 6.11 for Windows. Its support arrived in miurahr/aqtinstall#1000, merged after
    # that release, so a commit of master is installed until the next release. The tools, such as
    # llvm-mingw, are added to PATH.
    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        arch: ${{ inputs.qt-arch }}
        modules: qtmultimedia
        tools: ${{ inputs.qt-tools }}
        aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
        cache: true

    # The latest commits of vcpkg and of the overlay, which provides the libraries of stdware and
    # QSynthesis. The commits name the binary cache.
    - name: Clone vcpkg and the overlay
      shell: bash
      run: |
        set -euo pipefail
        vcpkg="$GITHUB_WORKSPACE/build/vcpkg"
        overlay="$GITHUB_WORKSPACE/build/vcpkg-overlay"
        cache="$GITHUB_WORKSPACE/build/vcpkg-cache"
        git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkg"
        git clone --depth 1 https://github.com/stdware/vcpkg-overlay.git "$overlay"
        mkdir -p "$cache"
        {
          echo "VCPKG_ROOT=$vcpkg"
          echo "VCPKG_OVERLAY=$overlay"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$cache"
          echo "VCPKG_COMMIT=$(git -C "$vcpkg" rev-parse HEAD)"
          echo "OVERLAY_COMMIT=$(git -C "$overlay" rev-parse HEAD)"
        } >> "$GITHUB_ENV"

    # The binary cache of vcpkg, which names each package by the hash of its inputs. A cache of
    # older commits is restored as well, and the packages whose inputs did not change are reused.
    # Restore and save are separate steps, because actions/cache saves only after the whole job
    # succeeded, and a failure of a later step would discard the packages built here.
    - id: vcpkg-cache
      uses: actions/cache/restore@v4
      with:
        path: build/vcpkg-cache
        key: vcpkg-${{ inputs.vcpkg-triplet }}-${{ env.VCPKG_COMMIT }}-${{ env.OVERLAY_COMMIT }}
        restore-keys: vcpkg-${{ inputs.vcpkg-triplet }}-

    # Classic mode with the triplets of the overlay, as the local installation. qactionkit and
    # substate build against the Qt above, which reaches the builds of vcpkg through QT_DIR.
    - name: Dependencies
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmd //c "$(cygpath -w "$VCPKG_ROOT/bootstrap-vcpkg.bat")" -disableMetrics
        else
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
        fi
        export QT_DIR="$QT_ROOT_DIR/lib/cmake/Qt6"
        export Qt6_DIR="$QT_DIR"
        export VCPKG_KEEP_ENV_VARS="QT_DIR;Qt6_DIR"
        # qiconmaker writes the icons of Windows and macOS at build time, see cmake/AddIcon.cmake.
        # It builds against the Qt above as well.
        icons=()
        if [ "$RUNNER_OS" != "Linux" ]; then
          icons=(qiconmaker)
        fi
        "$VCPKG_ROOT/vcpkg" install --triplet "${{ inputs.vcpkg-triplet }}" \
          "--overlay-ports=$VCPKG_OVERLAY/ports" "--overlay-triplets=$VCPKG_OVERLAY/triplets" \
          qmsetup stdcorelib stdcorelib-plugin stdutau substate "qactionkit[core,widgets]" \
          winacp wolf-midi r8brain-free-src libzip zlib "${icons[@]}"

    # vcpkg reports a failed port by the paths of its logs, which stay on the runner. The end of each
    # log of the configuration and of the build is printed instead.
    - name: vcpkg logs
      if: failure()
      shell: bash
      run: |
        for log in build/vcpkg/buildtrees/*/config-*-out.log build/vcpkg/buildtrees/*/config-*-err.log \
                   build/vcpkg/buildtrees/*/build-*-out.log build/vcpkg/buildtrees/*/build-*-err.log; do
          [ -s "$log" ] || continue
          echo "::group::$log"
          tail -120 "$log"
          echo "::endgroup::"
        done

    # The cache is saved as soon as the dependencies are installed.
    # A cache of the same key cannot be saved again, so the save is skipped after an exact hit.
    - if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: build/vcpkg-cache
        key: vcpkg-${{ inputs.vcpkg-triplet }}-${{ env.VCPKG_COMMIT }}-${{ env.OVERLAY_COMMIT }}

    # The packages are found through the toolchain of vcpkg, see third-party/Dependencies.cmake.
    # sccache cannot cache an object of MSVC whose debug information goes into a shared PDB (/Zi),
    # so the debug information is embedded in the objects (/Z7) through CMP0141, which the
    # minimum version of CMake leaves unset. The linker still writes the PDB of each binary.
    - name: Configure
      id: configure
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ]; then
          python="$pythonLocation/python.exe"
        else
          python="$pythonLocation/bin/python3"
        fi
        cmake -G Ninja -S . -B "$BUILD_DIR" \
          "-DCMAKE_BUILD_TYPE=$BUILD_TYPE" \
          ${BUILD_COMPILER:+"-DCMAKE_CXX_COMPILER=$BUILD_COMPILER"} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
          "-DHELLO_ENABLE_ADDRESS_SANITIZER=$BUILD_ASAN" \
          "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          "-DVCPKG_TARGET_TRIPLET=${{ inputs.vcpkg-triplet }}" \
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
          "-DPython3_EXECUTABLE=$python" \
          -DHELLO_BUILD_TESTS=ON \
          "-DHELLO_BUILD_CHANNEL=${{ inputs.channel }}"
        triplet="$(sed -n 's/^HELLO_TRIPLET:[A-Z]*=//p' $BUILD_DIR/CMakeCache.txt | tr -d '\r')"
        if [ -z "$triplet" ]; then
          echo "HELLO_TRIPLET is missing from the cache of the build."
          exit 1
        fi
        # A matrix entry that names another triplet than the build indicates a wrong entry or
        # a wrong compiler. Without the check, the assets would be named by another triplet
        # than the job.
        if [ "$triplet" != "${{ inputs.triplet }}" ]; then
          echo "::error::The build is $triplet, but the matrix names ${{ inputs.triplet }}."
          exit 1
        fi
        echo "triplet=$triplet" >> "$GITHUB_OUTPUT"

    - name: Build
      shell: bash
      run: cmake --build "$BUILD_DIR"

    # --no-tests=error, because ctest succeeds if it finds no test. The widget tests need no
    # display with the offscreen platform. The exit status is recorded in a file for the summary,
    # which runs after a failure as well.
    - name: Test
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        set +e
        if [ -n "${ASAN_RUNTIME_DIR:-}" ]; then
          PATH="$ASAN_RUNTIME_DIR:$PATH"
        fi
        # With AddressSanitizer on macOS, test_AppLoader ends with SEGV_ACCERR inside the runtime
        # of AddressSanitizer once it loads the built-in plugins after copies of its test plugin
        # were unloaded, with the ODR check off as well. The test runs in the other builds of
        # macOS and in the build of Linux with AddressSanitizer.
        exclude=()
        if [ "$BUILD_ASAN" = ON ] && [ "$RUNNER_OS" = "macOS" ]; then
          exclude=(-E '^test_AppLoader$')
        fi
        ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error "${exclude[@]}" 2>&1 |
          tee build/ctest.log
        status=${PIPESTATUS[0]}
        printf '%s' "$status" > build/ctest.status
        exit "$status"

    # Each failed test runs once more as the program itself with its exit status and the environment
    # that ctest gives it, or through ctest if the program is not found. A test that ends without
    # flushing its output, such as on an uncaught exception, shows nothing in the step Test, and
    # the exit status indicates the cause. -v2 prints the location of every check, so that the
    # last line of a test that blocks is the check it blocks in.
    - name: Failed tests
      if: >-
        failure() &&
        hashFiles(format('{0}/Testing/Temporary/LastTestsFailed.log', env.BUILD_DIR)) != ''
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
        QT_FORCE_STDERR_LOGGING: 1
      run: |
        set +e
        if [ -n "${ASAN_RUNTIME_DIR:-}" ]; then
          PATH="$ASAN_RUNTIME_DIR:$PATH"
        fi
        # The directories that ctest prepends to PATH on Windows: Qt, and the plugins that tests
        # load
        if [ -n "${QT_ROOT_DIR:-}" ] && [ "$RUNNER_OS" = "Windows" ]; then
          PATH="$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
        fi
        # macOS has no timeout, and a test runs without the limit there
        limit=
        if command -v timeout > /dev/null; then
          limit="timeout 120"
        fi
        for directory in "$PWD/$BUILD_DIR"/out/lib/helloutau/plugins/*/; do
          PATH="$directory:$PATH"
        done
        # The lines of the list end with CR LF on Windows, and the CR would be part of the name.
        for name in $(tr -d '\r' < "$BUILD_DIR/Testing/Temporary/LastTestsFailed.log" |
                      cut -d: -f2); do
          echo "::group::$name"
          program="$(find "$BUILD_DIR/out" -type f \( -name "${name}.exe" -o -name "$name" \) |
            head -1)"
          if [ -n "$program" ]; then
            # Every check is written with -v2 into a file, whose end shows the check that blocks
            # if the test is ended by the timeout
            $limit "$program" -v2 -o "build/$name.txt,txt"
            echo "$name exited with status $?"
            tail -60 "build/$name.txt"
          else
            ctest --test-dir "$BUILD_DIR" -R "^${name}\$" -V --timeout 120
          fi
          echo "::endgroup::"
        done

    - name: Summary
      if: always()
      shell: bash
      run: |
        status="$(cat build/ctest.status 2>/dev/null || true)"
        case "$status" in
          0) result="Passed" ;;
          "") result="Not run, because an earlier step failed" ;;
          *) result="Failed, see the step Test" ;;
        esac
        totals="$(grep -m1 'tests passed' build/ctest.log 2>/dev/null || true)"
        {
          echo "## ${{ steps.configure.outputs.triplet || runner.os }}, ${{ inputs.variant }}"
          echo
          echo "| | |"
          echo "|---|---|"
          echo "| Channel | \`${{ inputs.channel }}\` |"
          echo "| Commit | \`$GITHUB_SHA\` |"
          echo "| vcpkg | \`${VCPKG_COMMIT:-}\` |"
          echo "| vcpkg-overlay | \`${OVERLAY_COMMIT:-}\` |"
          echo "| Tests | $result |"
          echo
          echo "$totals"
          if command -v sccache > /dev/null; then
            echo
            echo '```'
            sccache --show-stats || true
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
