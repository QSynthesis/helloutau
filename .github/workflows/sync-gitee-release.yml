name: Sync release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to synchronize
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
    steps:
      - name: Resolve GitHub release metadata
        id: github-release
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json name,body)
          # Gitee requires the commit of a new release. The mirrored tag points to the same
          # commit as the GitHub tag.
          commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq '.sha')
          {
            echo "commit=${commit}"
            echo 'name<<GITHUB_RELEASE_NAME'
            jq -r '.name // ""' <<<"$release"
            echo 'GITHUB_RELEASE_NAME'
            echo 'body<<GITHUB_RELEASE_BODY'
            jq -r '.body // ""' <<<"$release"
            echo 'GITHUB_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Download GitHub release assets
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          ls -l release-assets

      - name: Sync release to Gitee
        env:
          RELEASE_NAME: ${{ steps.github-release.outputs.name }}
          RELEASE_BODY: ${{ steps.github-release.outputs.body }}
          RELEASE_COMMIT: ${{ steps.github-release.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          api="https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}"
          response_file=$(mktemp)

          # Resolving gitee.com from the runner times out now and then, so every request may be
          # repeated. Prints the HTTP status, or 000 if the request did not complete. A request
          # takes at most two minutes unless its arguments raise the limit.
          request() {
            curl --silent --show-error --connect-timeout 30 --max-time 120 \
              --output "$response_file" --write-out '%{http_code}' "$@" || true
          }
          # A failed request is repeated after a pause if it may succeed later: no response,
          # too many requests, or a server error. Any other failure ends the job.
          check_retryable() {
            local status=$1 what=$2
            echo "${what} failed (HTTP ${status})." >&2
            cat "$response_file" >&2 || true
            echo >&2
            if [[ "$status" != 000 && "$status" != 429 && "$status" != 5* ]]; then
              exit 1
            fi
            sleep 15
          }

          for attempt in $(seq 1 18); do
            status=$(request "${api}/tags?access_token=${GITEE_TOKEN}&per_page=100")
            if [[ "$status" == 2* ]] && jq -e --arg tag "$TAG_NAME" \
              'type == "array" and any(.[]; .name == $tag)' "$response_file" >/dev/null; then
              echo "Gitee tag ${TAG_NAME} is available."
              break
            fi
            echo "Waiting for Gitee tag ${TAG_NAME} (attempt ${attempt}/18, HTTP ${status})."
            if [ "$attempt" -eq 18 ]; then
              echo "Gitee did not receive the mirrored tag in time." >&2
              exit 1
            fi
            sleep 10
          done

          release_name="${RELEASE_NAME:-$TAG_NAME}"
          release_body="${RELEASE_BODY:-$release_name}"
          payload=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg name "$release_name" \
            --arg body "$release_body" \
            --arg commit "$RELEASE_COMMIT" \
            '{tag_name: $tag, name: $name, body: $body, target_commitish: $commit}')

          # The release is looked up again before every creation, so that a creation whose
          # response was lost is not repeated.
          release_id=""
          for attempt in $(seq 1 6); do
            status=$(request "${api}/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}")
            if [[ "$status" == 2* ]]; then
              release_id=$(jq -r '.id // empty' "$response_file" 2>/dev/null || true)
            elif [ "$status" != 404 ]; then
              check_retryable "$status" "Gitee release lookup (attempt ${attempt}/6)"
              continue
            fi
            if [ -n "$release_id" ]; then
              break
            fi
            status=$(request -X POST -H "Content-Type: application/json" --data "$payload" \
              "${api}/releases?access_token=${GITEE_TOKEN}")
            if [[ "$status" == 2* ]]; then
              release_id=$(jq -er '.id' "$response_file")
              break
            fi
            check_retryable "$status" "Gitee release creation (attempt ${attempt}/6)"
          done
          if [ -z "$release_id" ]; then
            echo "Gitee release creation failed." >&2
            exit 1
          fi
          echo "Gitee release ${release_id} is ready."

          # The attachments are listed again before every upload, so that an upload whose
          # response was lost is not repeated. An upload may take up to an hour, and is
          # abandoned and repeated if it stays below 10 KB/s for two minutes.
          attachments="${api}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}"

          # Uploads the file $1 and prints the HTTP status. curl redraws its progress meter in
          # place with carriage returns, which the log shows poorly, so that the latest line of
          # the meter is printed every ten seconds instead.
          upload() {
            local progress status_file pid
            progress=$(mktemp)
            status_file=$(mktemp)
            curl --show-error --connect-timeout 30 --max-time 3600 \
              --speed-limit 10240 --speed-time 120 \
              --output "$response_file" --write-out '%{http_code}' \
              -X POST -F "file=@$1" "$attachments" >"$status_file" 2>"$progress" &
            pid=$!
            local header=false
            while kill -0 "$pid" 2>/dev/null; do
              sleep 10
              # The final state is printed after the loop.
              kill -0 "$pid" 2>/dev/null || break
              # The meter starts with two lines of column titles.
              if [ "$header" = false ] && [ "$(wc -l <"$progress")" -ge 2 ]; then
                head -n 2 "$progress" >&2
                header=true
              fi
              tr '\r' '\n' <"$progress" | grep -v '^ *$' | tail -n 1 >&2 || true
            done
            wait "$pid" || true
            # The last line is the final state of the meter, or the error of curl.
            tr '\r' '\n' <"$progress" | grep -v '^ *$' | tail -n 1 >&2 || true
            cat "$status_file"
          }
          for file in release-assets/*; do
            name=$(basename "$file")
            uploaded=false
            for attempt in $(seq 1 6); do
              status=$(request "$attachments")
              if [[ "$status" != 2* ]]; then
                check_retryable "$status" "Listing the Gitee assets (attempt ${attempt}/6)"
                continue
              fi
              if jq -e --arg name "$name" 'type == "array" and any(.[]; .name == $name)' \
                "$response_file" >/dev/null; then
                echo "${name} is on Gitee."
                uploaded=true
                break
              fi
              echo "Uploading ${name} ($(du -h "$file" | cut -f1), attempt ${attempt}/6)."
              started=$SECONDS
              status=$(upload "$file")
              elapsed=$((SECONDS - started))
              if [[ "$status" == 2* ]]; then
                echo "Uploaded ${name} in ${elapsed} s."
                uploaded=true
                break
              fi
              check_retryable "$status" "Uploading ${name} after ${elapsed} s (attempt ${attempt}/6)"
            done
            if [ "$uploaded" != true ]; then
              echo "Gitee asset upload failed for ${name}." >&2
              exit 1
            fi
          done
