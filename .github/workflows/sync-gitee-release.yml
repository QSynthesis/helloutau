name: Sync release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub Release tag to synchronize
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve GitHub release metadata
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json name,body)
          {
            echo 'name<<GITHUB_RELEASE_NAME'
            jq -r .name <<<"$release"
            echo 'GITHUB_RELEASE_NAME'
            echo 'body<<GITHUB_RELEASE_BODY'
            jq -r .body <<<"$release"
            echo 'GITHUB_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets

      - name: Create Gitee release
        id: gitee-release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
          TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}
          RELEASE_NAME: ${{ steps.github-release.outputs.name }}
          RELEASE_BODY: ${{ steps.github-release.outputs.body }}
        run: |
          set -euo pipefail

          release_id=""
          for attempt in $(seq 1 18); do
            tags=$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 30 \
              "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/tags?access_token=${GITEE_TOKEN}&per_page=100" \
              2>/dev/null || printf '[]')
            tag_found=$(jq -r --arg tag "$TAG_NAME" \
              'if type == "array" then any(.[]; .name == $tag) else false end' \
              <<<"$tags")
            if [ "$tag_found" = "true" ]; then
              echo "Gitee tag ${TAG_NAME} is available."
              break
            fi
            echo "Waiting for Gitee tag ${TAG_NAME} (attempt ${attempt}/18)."
            if [ "$attempt" -eq 18 ]; then
              echo "Gitee did not receive the mirrored tag in time." >&2
              exit 1
            fi
            sleep 10
          done

          existing=$(curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 30 \
            "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}" \
            2>/dev/null || printf '{}')
          release_id=$(jq -r '.id // empty' <<<"$existing")
          if [ -z "$release_id" ]; then
            payload=$(jq -n \
              --arg tag "$TAG_NAME" \
              --arg name "$RELEASE_NAME" \
              --arg body "$RELEASE_BODY" \
              '{tag_name: $tag, name: $name, body: $body}')
            response=$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 60 \
              -X POST \
              -H "Content-Type: application/json" \
              "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases?access_token=${GITEE_TOKEN}" \
              --data "$payload")
            release_id=$(jq -er '.id' <<<"$response")
          fi

          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload release assets to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
          RELEASE_ID: ${{ steps.gitee-release.outputs.release_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in release-assets/*; do
            curl --silent --show-error --fail \
              -X POST \
              "https://gitee.com/api/v5/repos/${GITEE_REPOSITORY}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
              -F "file=@${file}" \
              >/dev/null
          done
