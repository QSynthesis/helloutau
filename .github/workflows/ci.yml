name: ci
run-name: ci (${{ github.head_ref || github.ref_name }})

# Compiles and runs every test, on a pull request to main and on manual dispatch, once for each
# system of the matrix and each variant of the build: release, debug and asan. A push to main runs deploy.yml instead, which runs the same tests before
# packaging, so that a push is not built twice. Development happens on dev, and git promote moves
# main. See the workflow in docs/Distribution.md.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same pull request or branch replaces the older one.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.triplet }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The triplet names the job, and the action checks it against the triplet of the build.
        # Each variant of the action runs for each system. AddressSanitizer is not built for MinGW.
        triplet: [ x86_64-windows-msvc, x86_64-windows-mingw, x86_64-linux-gcc, arm64-mac-appleclang ]
        variant: [ release, debug, asan ]
        exclude:
          - triplet: x86_64-windows-mingw
            variant: asan
        include:
          # As in deploy.yml
          - triplet: x86_64-linux-gcc
            os: ubuntu-22.04
            vcpkg-triplet: x64-linux
            qt-arch: linux_gcc_64
          - triplet: arm64-mac-appleclang
            os: macos-15
            vcpkg-triplet: arm64-osx
            qt-arch: clang_64
          - triplet: x86_64-windows-msvc
            os: windows-latest
            vcpkg-triplet: x64-windows
            qt-arch: win64_msvc2022_64
          # As in deploy.yml
          - triplet: x86_64-windows-mingw
            os: windows-latest
            vcpkg-triplet: x64-mingw-dynamic
            qt-arch: win64_llvm_mingw
            qt-tools: tools_llvm_mingw1706,qt.tools.win64_llvm_mingw1706
            compiler: x86_64-w64-mingw32-clang++
    steps:
      # The whole history, because BuildInfo.h records the number of commits as the revision.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build
        uses: ./.github/actions/build-and-test
        with:
          variant: ${{ matrix.variant }}
          channel: ci
          triplet: ${{ matrix.triplet }}
          vcpkg-triplet: ${{ matrix.vcpkg-triplet }}
          qt-arch: ${{ matrix.qt-arch }}
          qt-tools: ${{ matrix.qt-tools }}
          compiler: ${{ matrix.compiler }}
