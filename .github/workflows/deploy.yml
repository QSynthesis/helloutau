name: deploy
run-name: deploy (${{ github.ref_name }})

# Compiles, tests and packages HelloUtau, on a push to main, on a tag v* and on manual dispatch,
# once for each system of the matrix. Development happens on dev, and git promote moves main, so a
# push to main is the integration checkpoint. A tag v<HELLO_VERSION> builds the channel release
# and publishes the release, and every other run builds the channel ci, whose assets carry the
# commit in their names. Both channels run the same steps. The job package builds the variant
# release, tests and packages it, and the job test builds and tests the variants debug and asan
# alongside. The assets of a run are packaged whatever the job test reports, and a release is
# published only if both jobs pass. See the build channels and the workflow in
# docs/Distribution.md.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

# A newer run of the same branch replaces the older one. The run of a tag is never cancelled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci' }}

jobs:
  package:
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The name of the job, which the action checks against the triplet of the build.
          # The steps take the triplet from the output of the action.
          - triplet: x86_64-windows-msvc
            os: windows-latest
            vcpkg-triplet: x64-windows
            qt-arch: win64_msvc2022_64
    env:
      INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
    steps:
      # The whole history, because BuildInfo.h records the number of commits as the revision.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build
        uses: ./.github/actions/build-and-test
        with:
          variant: release
          channel: ${{ env.CHANNEL }}
          triplet: ${{ matrix.triplet }}
          vcpkg-triplet: ${{ matrix.vcpkg-triplet }}
          qt-arch: ${{ matrix.qt-arch }}

      # A release whose tag names another version than the build would be found by no update.
      - name: Check the tag against the version
        if: env.CHANNEL == 'release'
        shell: bash
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:[A-Z]*=//p' build/Release/CMakeCache.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not name the version $version of the build."
            exit 1
          fi

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup.exe"
          $directory = "$env:RUNNER_TEMP\innosetup"
          Invoke-WebRequest $env:INNO_SETUP_URL -OutFile $installer
          Start-Process $installer -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=$directory"
          "ISCC=$directory\ISCC.exe" >> $env:GITHUB_ENV

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/installer/windows/package.ps1 -BuildDir build/Release -OutputDir build/package -Iscc $env:ISCC

      # The paths of the three assets. The portable package is the archive that is not the symbols.
      - name: Assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          cd build/package
          symbols="$(ls -- *-symbols.zip)"
          setup="$(ls -- *-setup.exe)"
          portable="$(ls -- *.zip | grep -v -- '-symbols\.zip$')"
          {
            echo "portable=build/package/$portable"
            echo "setup=build/package/$setup"
            echo "symbols=build/package/$symbols"
          } >> "$GITHUB_OUTPUT"

      # Each asset is an artifact of its own and is not zipped again (archive: false), so that it
      # downloads as the file itself, as from the release. The artifact is named after the file,
      # whose name carries the channel and the commit for a build of another channel than release.
      # The digests are in the summary of the run, and the job release computes SHA256SUMS.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.portable }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.setup }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.assets.outputs.symbols }}
          archive: false
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo
            echo "### Assets"
            echo
            sed 's/^[0-9a-f]*  /- `/; s/$/`/' build/package/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

  # The variants debug and asan, which only build and test
  test:
    name: ${{ matrix.triplet }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # As in the job package, for each variant
        triplet: [ x86_64-windows-msvc ]
        variant: [ debug, asan ]
        include:
          - triplet: x86_64-windows-msvc
            os: windows-latest
            vcpkg-triplet: x64-windows
            qt-arch: win64_msvc2022_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/build-and-test
        with:
          variant: ${{ matrix.variant }}
          channel: ${{ env.CHANNEL }}
          triplet: ${{ matrix.triplet }}
          vcpkg-triplet: ${{ matrix.vcpkg-triplet }}
          qt-arch: ${{ matrix.qt-arch }}

  # The release of a tag, with the assets of every system and the notes of
  # docs/changelog/<version>.md, which Unreleased.md becomes on the release. One SHA256SUMS for
  # the assets of every system, which the update reads, is computed from the downloaded files.
  # The symbols are attached as well, because the artifacts of a run expire.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ package, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Each artifact is a single file uploaded without archive, which download-artifact 8
      # writes as the file itself.
      - uses: actions/download-artifact@v8
        with:
          pattern: helloutau-*
          path: assets
          merge-multiple: true

      - name: Create the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="docs/changelog/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "The notes $notes are missing from the commit of the tag."
            exit 1
          fi
          (cd assets && sha256sum -- * > SHA256SUMS)
          cat assets/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag \
            --title "HelloUtau ${version}" --notes-file "$notes"

      # A release created with the token of the workflow triggers no other workflow, so the
      # synchronization is started explicitly.
      - name: Synchronize the release to Gitee
        run: gh workflow run sync-gitee-release.yml -f tag_name="$GITHUB_REF_NAME"
