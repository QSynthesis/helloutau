<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>HelloUtau</title>
  <!-- The drawing of app.svg on the pixel grid of 32 px. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="5" y1="9" x2="27" y2="23">
      <stop offset="0" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#2459e6"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="10.5" cy="20" r="1.6" fill="#000"/>
      <circle cx="21.5" cy="12" r="1.6" fill="#000"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="6.5" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="none" stroke="#1d2b44"
        stroke-opacity=".1"/>
  <path d="M7 20H10.5C16.5 20 15.5 12 21.5 12H25" fill="none" stroke="url(#band)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" mask="url(#points)"/>
</svg>
