<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <title>HelloUtau</title>
  <!-- The drawing of app.svg on the pixel grid of 20 px: the plate fills the square, and the
       band is a flat color. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#fff"/>
      <circle cx="7" cy="13" r="1" fill="#000"/>
      <circle cx="13" cy="7" r="1" fill="#000"/>
    </mask>
  </defs>
  <rect width="20" height="20" rx="4.5" fill="url(#plate)"/>
  <rect x=".5" y=".5" width="19" height="19" rx="4" fill="none" stroke="#1d2b44"
        stroke-opacity=".12"/>
  <path d="M5 13H7C10.5 13 9.5 7 13 7H15" fill="none" stroke="#336cf6" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" mask="url(#points)"/>
</svg>
