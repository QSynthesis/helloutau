<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <title>HelloUtau</title>
  <!-- The drawing of app.svg on the pixel grid of 16 px: the plate fills the square, the
       band is a flat color, and each control point is one pixel. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#fff"/>
      <rect x="5" y="10" width="1" height="1" fill="#000"/>
      <rect x="10" y="5" width="1" height="1" fill="#000"/>
    </mask>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#plate)"/>
  <rect x=".5" y=".5" width="15" height="15" rx="3" fill="none" stroke="#1d2b44"
        stroke-opacity=".12"/>
  <path d="M4.5 10.5H5.5C8.5 10.5 7.5 5.5 10.5 5.5H11.5" fill="none" stroke="#336cf6" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" mask="url(#points)"/>
</svg>
