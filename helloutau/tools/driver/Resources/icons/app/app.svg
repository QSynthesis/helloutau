<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>HelloUtau</title>
  <!-- Two notes of the piano roll joined by the portamento into one band, with the pitch points
       at its ends cut out, on a light plate. The drawing for 60 px and above, on a grid of 256:
       app-48.svg scaled by 16/3. app-48.svg and the smaller drawings are aligned to the pixel
       grids of the smaller sizes. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="42.667" y1="69.333" x2="213.333"
                    y2="186.667">
      <stop offset="0" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#2459e6"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <circle cx="85.333" cy="162.667" r="12.8" fill="#000"/>
      <circle cx="170.667" cy="93.333" r="12.8" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="53.333" fill="url(#plate)"/>
  <rect x="9.333" y="9.333" width="237.333" height="237.333" rx="52" fill="none" stroke="#1d2b44"
        stroke-opacity=".08" stroke-width="2.667"/>
  <path d="M56 162.667H85.333C133.333 162.667 122.667 93.333 170.667 93.333H200" fill="none"
        stroke="url(#band)" stroke-width="45.333" stroke-linecap="round" stroke-linejoin="round"
        mask="url(#points)"/>
</svg>
