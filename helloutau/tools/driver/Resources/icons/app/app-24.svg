<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <title>HelloUtau</title>
  <!-- The drawing of app.svg on the pixel grid of 24 px, for 24 px and 30 px: the plate
       fills the square, and the band is a flat color. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <circle cx="8" cy="15.5" r="1.3" fill="#000"/>
      <circle cx="16" cy="8.5" r="1.3" fill="#000"/>
    </mask>
  </defs>
  <rect width="24" height="24" rx="5.5" fill="url(#plate)"/>
  <rect x=".5" y=".5" width="23" height="23" rx="5" fill="none" stroke="#1d2b44"
        stroke-opacity=".12"/>
  <path d="M5.5 15.5H8C12.5 15.5 11.5 8.5 16 8.5H18.5" fill="none" stroke="#336cf6" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" mask="url(#points)"/>
</svg>
