<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <title>HelloUtau</title>
  <!-- Two notes of the piano roll joined by the portamento into one band, with the pitch points
       at its ends cut out, on a light plate. The drawing for 36 px and above. -->
  <defs>
    <linearGradient id="plate" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".5" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#e6eaf0"/>
    </linearGradient>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="8" y1="13" x2="40" y2="35">
      <stop offset="0" stop-color="#4f86ff"/>
      <stop offset="1" stop-color="#2459e6"/>
    </linearGradient>
    <mask id="points" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <circle cx="16" cy="30.5" r="2.4" fill="#000"/>
      <circle cx="32" cy="17.5" r="2.4" fill="#000"/>
    </mask>
  </defs>
  <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="url(#plate)"/>
  <rect x="1.75" y="1.75" width="44.5" height="44.5" rx="9.75" fill="none" stroke="#1d2b44"
        stroke-opacity=".08" stroke-width=".5"/>
  <path d="M10.5 30.5H16C25 30.5 23 17.5 32 17.5H37.5" fill="none" stroke="url(#band)"
        stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" mask="url(#points)"/>
</svg>
